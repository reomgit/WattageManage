name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CI scripts and signing profile validation
        run: |
          bash -n scripts/ci/*.sh
          python3 -m unittest discover -s scripts/ci/tests -v

      - name: Build and package unsigned IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/ci/build-ipa.sh unsigned

      - name: Upload IPA and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wattage-unsigned-${{ github.run_number }}
          path: |
            build/ci/export/*.ipa
            build/ci/export/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 30
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ github.run_number }}
          path: build/ci/*.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this run's IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: Wattage-unsigned-${{ github.run_number }}
        run: gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir release

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Wattage $RELEASE_TAG" \
              --notes 'Unsigned iPhone IPA. Re-sign with your own Apple certificate and profiles before installing. App Groups and the widget extension need compatible provisioning. See docs/ci-cd.md for signing instructions.'
          fi
          gh release upload "$RELEASE_TAG" release/*.ipa release/SHA256SUMS --clobber
