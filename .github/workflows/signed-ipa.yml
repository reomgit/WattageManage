name: Signed IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Apple export method (release-testing for registered devices)
        required: true
        default: release-testing
        type: choice
        options:
          - release-testing
          - app-store-connect

permissions:
  contents: read

concurrency:
  group: signed-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-ipa:
    # Secrets are used only in manual runs, never in pull requests.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install temporary Apple signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROVISION_PROFILE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: scripts/ci/install-signing.sh

      - name: Archive and export signed IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/ci/build-ipa.sh signed

      - name: Upload signed IPA and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wattage-signed-${{ inputs.export_method }}-${{ github.run_number }}
          path: |
            build/ci/export/*.ipa
            build/ci/export/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-build-logs-${{ github.run_number }}
          path: build/ci/*.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Remove signing assets
        if: always()
        run: scripts/ci/cleanup-signing.sh
